# Advanced warm-start strategy
warm_start_strategy:
  enabled: true
  mode: "guide"  # Use warm-start to guide search
  
# Early stopping for individual trials
early_stopping:
  patience: 100  # Stop if no improvement for 100 evaluations
  min_delta: 0.001
  monitor: "hierarchical_f1"
  mode: "max"  # Consistent with optimization direction

# Resource management
resources:
  timeout_per_trial: 1800  # 30 minutes max per trial
  n_jobs: 1  # Single GPU per trial