# Full Hyperparameter Tuning Configuration
# Comprehensive search for production model optimization
# Includes advanced features like optimizer choice and learning rate scheduling

# Optuna Study Configuration
optuna:
  study_name: "cellxgene_mlp_production"
  direction: "minimize"
  metric_to_optimize: "val_loss"
  n_trials: 100  # Comprehensive search
  n_epochs_per_trial: 3  # Longer trials for better evaluation
  
  # Advanced sampler with more startup trials
  sampler:
    type: "TPESampler"
    n_startup_trials: 20  # More random exploration initially
    seed: 42
  
  # Aggressive pruning to save compute
  pruner:
    type: "MedianPruner"
    n_startup_trials: 10
    n_warmup_steps: 200
    interval_steps: 100

# Comprehensive Hyperparameter Search Space
hyperparameters:
  # Model architecture
  n_dims:
    type: "categorical"
    choices: [500, 1000, 1500, 2000, 2500, 3078]
    default: 3078
  
  n_hidden_layers:
    type: "int"
    low: 1
    high: 5
    default: 3
  
  dropout:
    type: "float"
    low: 0.0
    high: 0.5
    default: 0.053
  
  # Optimizer configuration
  optimizer_type:
    type: "categorical"
    choices: ["adam", "adamw", "sgd"]
    default: "adam"
  
  # Training parameters
  learning_rate:
    type: "float"
    low: 1e-6
    high: 1e-2
    default: 4.366e-5
    log: true
  
  weight_decay:
    type: "float"
    low: 0
    high: 1e-3
    default: 1e-5
    log: false  # Include 0 for no weight decay
  
  batch_size:
    type: "categorical"
    choices: [256, 512, 1024, 2048, 4096]
    default: 1024
  
  # Learning rate scheduling
  lr_scheduler:
    type: "categorical"
    choices: ["none", "cosine", "step", "exponential"]
    default: "none"
  
  # Conditional parameters for schedulers
  lr_scheduler_params:
    # For step scheduler
    step_size:
      type: "int"
      low: 500
      high: 2000
      default: 1000
      condition: "lr_scheduler == 'step'"
    
    # For step and exponential schedulers
    gamma:
      type: "float"
      low: 0.1
      high: 0.9
      default: 0.5
      condition: "lr_scheduler in ['step', 'exponential']"
    
    # For cosine scheduler
    T_max:
      type: "int"
      low: 1000
      high: 5000
      default: 2000
      condition: "lr_scheduler == 'cosine'"
  
  # Regularization
  label_smoothing:
    type: "float"
    low: 0.0
    high: 0.2
    default: 0.0
  
  # Advanced training
  gradient_clip_val:
    type: "categorical"
    choices: [null, 0.5, 1.0, 5.0]
    default: null
  
  mixed_precision:
    type: "categorical"
    choices: [true, false]
    default: false

# Fixed Parameters
fixed_params:
  # Data settings
  s3_bucket: "pythiomicsdata"
  s3_prefix: "cellxgene_v2/training_v1_suffled"
  
  # Training settings
  epochs: 10  # Full training epochs for final model
  
  # Evaluation settings
  eval_every_n_batches: 10
  eval_full_every_n_batches: 250
  checkpoint_every_n_batches: 1000
  
  # System settings
  device: "auto"
  num_workers: 0
  seed: 42
  
  # Features
  enable_hierarchical_metrics: true
  shuffle_files_per_epoch: true
  shuffle_within_files: true

# Warm-start configurations from best known results
best_configs:
  - name: "best_notebook_run"
    hyperparameters:
      n_dims: 500
      n_hidden_layers: 3
      dropout: 0.053
      learning_rate: 4.366e-5
      weight_decay: 1e-5
      batch_size: 1024
      optimizer_type: "adam"
      lr_scheduler: "none"
      mixed_precision: false
      label_smoothing: 0.0
    metrics:
      val_loss: 2.125
      val_recall_at_10: 0.870
    priority: 1
    
  - name: "high_capacity_variant"
    hyperparameters:
      n_dims: 1500
      n_hidden_layers: 4
      dropout: 0.1
      learning_rate: 1e-4
      weight_decay: 5e-5
      batch_size: 2048
      optimizer_type: "adamw"
      lr_scheduler: "cosine"
      T_max: 2000
      mixed_precision: true
      label_smoothing: 0.1
    priority: 2

# Advanced warm-start strategy
warm_start_strategy:
  enabled: true
  mode: "guide"  # Use warm-start to guide search
  
  # Explore near best configs
  exploration:
    enabled: true
    perturbation: 0.15  # 15% perturbation from best values
    n_neighbors: 3  # Generate 3 trials near each warm-start

# Early stopping for individual trials
early_stopping:
  patience: 5  # Stop if no improvement for 5 evaluations
  min_delta: 0.001
  monitor: "val_loss"
  mode: "min"

# Resource management
resources:
  timeout_per_trial: 1800  # 30 minutes max per trial
  n_jobs: 1  # Single GPU per trial