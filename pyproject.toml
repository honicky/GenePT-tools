[project]
name = "genept-tools"
version = "0.1.0"
description = "Your project description"
dependencies = [
    "anndata",
    "boto3",
    "datasets",
    "lightgbm",
    "nbformat",
    "numpy",
    "openai",
    "pandas",
    "scanpy",
    "scikit-learn",
    "umap-learn",
]

[project.optional-dependencies]
dev = [
    "matplotlib",
    "seaborn",
    "black[jupyter]",
    "isort",
    "ipykernel",
    "pip-tools",
    "plotly",
    "pytest",
    "yapf==0.40.2",
]

with_torch = [
    "torch==2.4.0",
]

[tool.pytest.ini_options]
addopts = "-v --ignore=.venv --ignore=__pycache__ -W ignore::DeprecationWarning"
testpaths = ["test"]
python_files = ["test_*.py"]
norecursedirs = [
    ".*",
    "__pycache__",
    "*.egg",
    ".eggs",
    "*.egg-info",
    "dist",
    "build",
    ".env",
    ".venv",
    "venv",
    "env",
    "docs"
]
filterwarnings = [
    "ignore:Transforming to str index:anndata._core.aligned_df.ImplicitModificationWarning",
]

[tool.yapf]
based_on_style = "yapf"
column_limit = 88
continuation_indent_width = 2
indent_width = 2


[tool.isort]
profile = "black"
multi_line_output = 3 
skip = [".gitignore", ".dockerignore"]